<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>展厅互动试玩 · JARDIN Archive</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #070a08;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    }
    iframe#stage {
      display: block;
      width: 100vw;
      height: 100vh;
      border: 0;
    }
    .plaque {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 20;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 8px 14px;
      border-radius: 3px;
      background: rgba(8, 11, 9, 0.74);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(212, 175, 106, 0.28);
      color: #f2ece1;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
      transition: opacity 0.35s ease;
    }
    .plaque.idle { opacity: 0.42; }
    .plaque:hover, .plaque.collapsed { opacity: 1; }
    .plaque.collapsed .plaque-item { display: none; }
    .plaque-sep { width: 1px; height: 14px; background: rgba(255, 255, 255, 0.14); }
    .plaque-title {
      font-family: "Baskerville", "Songti SC", "STSong", Georgia, serif;
      font-size: 14px;
      letter-spacing: 0.04em;
      color: #f6f0e4;
    }
    .plaque-author { font-size: 11.5px; letter-spacing: 0.06em; color: #939a91; }
    .plaque-btn {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 2px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.05);
      color: #e6e0d5;
      font-size: 12px;
      letter-spacing: 0.04em;
      text-decoration: none;
      cursor: pointer;
    }
    .plaque-btn:hover { background: rgba(255, 255, 255, 0.12); }
    .plaque-btn.gold {
      border-color: rgba(212, 175, 106, 0.52);
      background: rgba(212, 175, 106, 0.18);
      color: #ecd3a0;
    }
  </style>
</head>
<body>
  <div class="plaque" id="hud">
    <a class="plaque-btn plaque-item" href="./">← 返回典藏馆</a>
    <span class="plaque-sep plaque-item"></span>
    <span class="plaque-title plaque-item" id="workTitle">展厅加载中</span>
    <span class="plaque-author plaque-item" id="workAuthor"></span>
    <a class="plaque-btn gold plaque-item" id="downloadBtn" href="#" target="_blank" rel="noopener" style="display:none;">获取桌面壁纸包</a>
    <button class="plaque-btn plaque-item" type="button" onclick="copyLink(this)">复制分享</button>
    <button class="plaque-btn plaque-item" type="button" onclick="toggleFullscreen()">全屏</button>
    <button class="plaque-btn" type="button" id="toggleBtn" onclick="toggleHud()">收起</button>
  </div>

  <iframe id="stage" allow="camera; fullscreen; autoplay"></iframe>

  <script>
    var idleTimer = null;
    var hud = document.getElementById('hud');
    function bumpHud() {
      hud.classList.remove('idle');
      clearTimeout(idleTimer);
      idleTimer = setTimeout(function () { hud.classList.add('idle'); }, 3200);
    }
    window.addEventListener('pointermove', bumpHud);
    bumpHud();

    function toggleHud() {
      var btn = document.getElementById('toggleBtn');
      var collapsed = hud.classList.toggle('collapsed');
      btn.textContent = collapsed ? '展开铭牌' : '收起';
    }
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen && document.exitFullscreen();
      }
    }
    function copyLink(btn) {
      navigator.clipboard.writeText(window.location.href).then(function () {
        var old = btn.textContent;
        btn.textContent = '已复制 ✓';
        setTimeout(function () { btn.textContent = old; }, 1400);
      });
    }

    var params = new URLSearchParams(window.location.search);
    var rawId = (params.get('id') || 'jardin-oil-tapestry').trim();
    var validId = /^[a-z0-9][a-z0-9-_]{1,63}$/.test(rawId) ? rawId : 'jardin-oil-tapestry';

    document.getElementById('stage').src = './works/' + encodeURIComponent(validId) + '/index.html';

    fetch('./works/manifest.json?t=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (list) {
        var works = Array.isArray(list) ? list : (list.works || []);
        var w = works.find(function (item) { return item.id === validId; });
        if (w) {
          document.title = (w.title || w.id) + ' · JARDIN Archive';
          document.getElementById('workTitle').textContent = w.title || w.id;
          document.getElementById('workAuthor').textContent = '/ ' + (w.author || 'JARDIN Studio');
          if (w.downloadUrl) {
            var dl = document.getElementById('downloadBtn');
            dl.href = w.downloadUrl;
            dl.style.display = 'inline-flex';
          }
        } else {
          document.getElementById('workTitle').textContent = validId;
        }
      })
      .catch(function () {
        document.getElementById('workTitle').textContent = validId;
      });
  </script>
</body>
</html>
